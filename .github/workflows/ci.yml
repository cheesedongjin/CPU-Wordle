name: Test and deploy GitHub Pages
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install ziglang==0.17.1
      - run: python scripts/test_c.py
      - run: python scripts/build_wasm.py
      - run: python scripts/bundle_data.py
      - run: git diff --exit-code -- web/wordle_wasm.js web/words.js
      - run: node --check web/app.js
      - run: node --test tests/test_local.cjs
      - run: python scripts/build_pages.py

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/build_pages.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/pages
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
