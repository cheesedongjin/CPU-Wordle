services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wordle
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: wordle
    volumes:
      - wordle-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wordle"]
      interval: 2s
      timeout: 3s
      retries: 20
  web:
    build: .
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: postgres://wordle:local-development-only@db:5432/wordle
      APP_ORIGIN: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
volumes:
  wordle-db:
